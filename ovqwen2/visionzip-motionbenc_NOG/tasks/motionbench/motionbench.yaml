dataset_path: json
dataset_kwargs:
  data_files: /project/rhu/MotionBench_Data/MotionBench/video_info.meta.jsonl
  cache_dir: /project/rhu/dpalfaro/cache/huggingface/datasets
task: motionbench
test_split: train
output_type: generate_until
doc_to_visual: !function utils.motionbench_doc_to_visual
doc_to_text: !function utils.motionbench_doc_to_text
doc_to_target: !function utils.motionbench_doc_to_target
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.motionbench_process_results
metric_list:
  - metric: motionbench_accuracy
    aggregation: !function utils.motionbench_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
metadata:
  - version: 0.0
